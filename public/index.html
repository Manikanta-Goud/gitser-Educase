<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GITSER – GitHub Profile Analyzer</title>
    <meta name="description" content="GITSER: Analyze any GitHub profile to get deep insights on repositories, followers, and activity.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Pro Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <h1 class="splash-logo">GIT<span>SER</span></h1>
            <div class="splash-decoder">
                <div class="decoder-word">
                    <span class="glow-red">git</span>hub
                </div>
                <div class="decoder-divider"></div>
                <div class="decoder-word">
                    <span class="glow-blue">ser</span>ch
                </div>
            </div>
            <div class="splash-loader"></div>
        </div>
    </div>
    <script>
        if (sessionStorage.getItem('splashShown')) {
            document.getElementById('splash-screen').style.display = 'none';
        } else {
            sessionStorage.setItem('splashShown', 'true');
        }
    </script>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-wrap">
                <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="16" cy="16" r="16" fill="url(#lg1)"/>
                    <path d="M10 22C10 18 13 15 16 15C19 15 22 18 22 22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="16" cy="11" r="3" fill="white"/>
                    <defs><linearGradient id="lg1" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
                </svg>
                <h1 class="logo-text" style="font-size: 2rem;">GIT<span class="logo-accent">SER</span></h1>
            </div>
            
            <nav class="nav-links">
                <a href="index.html" class="nav-link active">🔍 Analyze</a>
                <a href="searched.html" class="nav-link">📋 Searched Profiles</a>
                <a href="saved.html" class="nav-link">⭐ Saved Profiles</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h1 class="logo-text">Analyze <span class="logo-accent">Profile</span></h1>
                <p class="header-subtitle">Search any GitHub profile and get deep insights.</p>
            </header>

            <!-- Search Section -->
            <section class="search-section glass-card">
                <form id="analyze-form" class="search-form">
                    <div class="input-wrap">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="username-input" placeholder="Search any GitHub username..." autocomplete="off" spellcheck="false" required>
                    </div>
                    <button type="submit" id="analyze-btn" class="btn-primary">
                        <span class="btn-label">Analyze</span>
                        <div class="btn-spinner hidden"></div>
                    </button>
                </form>
                <p id="error-msg" class="error-msg hidden"></p>
            </section>

            <!-- Current Profile Result -->
            <section id="result-section" class="hidden fade-in">
                <!-- injected by JS -->
            </section>

            <!-- History (Recent 5) -->
            <section class="history-section">
                <div class="section-heading" style="justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <h2>Recent Analyzed</h2>
                        <span class="count-badge" id="count-badge">0</span>
                    </div>
                    <a href="searched.html" style="color: var(--primary); font-size: 0.9rem; font-weight: 500; text-decoration: none;">View all →</a>
                </div>
                <div id="history-grid" class="history-grid">
                    <!-- injected by JS -->
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
