<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Details – GITSER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-wrap">
                <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="16" cy="16" r="16" fill="url(#lg1)"/>
                    <path d="M10 22C10 18 13 15 16 15C19 15 22 18 22 22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="16" cy="11" r="3" fill="white"/>
                    <defs><linearGradient id="lg1" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
                </svg>
                <h1 class="logo-text" style="font-size: 2rem;">GIT<span class="logo-accent">SER</span></h1>
            </div>
            
            <nav class="nav-links">
                <a href="index.html" class="nav-link">🔍 Analyze</a>
                <a href="searched.html" class="nav-link">📋 Searched Profiles</a>
                <a href="saved.html" class="nav-link">⭐ Saved Profiles</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="loader" style="display:flex; justify-content:center; padding:5rem;">
                <div class="spinner"></div>
            </div>
            
            <div id="error-msg" class="error-msg hidden"></div>

            <div id="profile-content" class="hidden">
                <!-- Back Button -->
                <a href="index.html" class="back-btn" style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-muted); text-decoration: none; font-weight: 500; margin-bottom: 1.5rem; transition: color 0.2s;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Search
                </a>

                <!-- Hero Section -->
                <div class="profile-page-hero" id="profile-hero">
                    <!-- Injected by JS -->
                </div>

                <!-- Tabs -->
                <div class="modal-tabs" style="border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; padding: 0;">
                    <button class="tab-btn active" data-tab="repos">Repositories</button>
                    <button class="tab-btn" data-tab="followers">Followers</button>
                    <button class="tab-btn" data-tab="following">Following</button>
                    <button class="tab-btn" data-tab="score">🏆 Score</button>
                    <button class="tab-btn" data-tab="languages">📊 Languages</button>
                </div>

                <!-- Tab Panels -->
                <div id="tab-repos" class="tab-panel active">
                    <div id="repos-list" class="repos-grid">
                        <div class="tab-loader"><div class="spinner"></div></div>
                    </div>
                </div>
                <div id="tab-followers" class="tab-panel">
                    <div id="followers-list" class="users-grid">
                        <div class="tab-loader"><div class="spinner"></div></div>
                    </div>
                </div>
                <div id="tab-following" class="tab-panel">
                    <div id="following-list" class="users-grid">
                        <div class="tab-loader"><div class="spinner"></div></div>
                    </div>
                </div>
                <div id="tab-score" class="tab-panel">
                    <div id="score-panel" class="glass-card">
                        <div class="tab-loader"><div class="spinner"></div></div>
                    </div>
                </div>
                <div id="tab-languages" class="tab-panel">
                    <div id="languages-panel" class="glass-card">
                        <div class="tab-loader"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="profile.js"></script>
</body>
</html>
