<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Profiles – GITSER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-wrap">
                <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="16" cy="16" r="16" fill="url(#lg1)"/>
                    <path d="M10 22C10 18 13 15 16 15C19 15 22 18 22 22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="16" cy="11" r="3" fill="white"/>
                    <defs><linearGradient id="lg1" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
                </svg>
                <h1 class="logo-text" style="font-size: 2rem;">GIT<span class="logo-accent">SER</span></h1>
            </div>
            
            <nav class="nav-links">
                <a href="index.html" class="nav-link">🔍 Analyze</a>
                <a href="searched.html" class="nav-link">📋 Searched Profiles</a>
                <a href="saved.html" class="nav-link active">⭐ Saved Profiles</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header" style="text-align: left; margin-bottom: 2rem;">
                <h1 style="font-family:var(--font-head); font-size:2rem;">Saved Profiles</h1>
                <p class="header-subtitle">Profiles you have starred for quick access.</p>
            </header>

            <div id="loader" style="display:flex; justify-content:center; padding:3rem;">
                <div class="spinner"></div>
            </div>

            <div id="profiles-grid" class="history-grid hidden">
                <!-- injected by JS -->
            </div>
        </main>
    </div>

    <script src="saved.js"></script>
</body>
</html>
